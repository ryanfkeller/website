version: "3"
services:
  hfla_site:
    image: hackforlaops/ghpages:latest
    container_name: hfla_site
    command: >
      sh -c "jekyll clean &&
             jekyll serve --force_polling --livereload --config _config.yml,_config.docker.yml -I"
    environment:
      - JEKYLL_ENV=docker
    ports:
      - 4000:4000
      - 35729:35729
    volumes:
      - .:/srv/jekyll

  hfla_test:
    build: ./docker/test
    image: hfla_test_image
    container_name: hfla_test
    profiles:
      - test
    working_dir: /workspace
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_TEST_REPO_OWNER=${GITHUB_TEST_REPO_OWNER}
      - GITHUB_TEST_REPO_NAME=${GITHUB_TEST_REPO_NAME}
    volumes:
      - .:/workspace
